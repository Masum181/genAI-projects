[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Modular foundation for a multi-tenant enterprise knowledge platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "beautifulsoup4>=4.12,<5",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "openpyxl>=3.1,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.11,<2",
    "redis>=5,<7",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0,<2",
    "openai>=1.50,<3",
    "sentence-transformers>=3.0,<6",
]
dev = [
    "httpx2>=2.0,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
